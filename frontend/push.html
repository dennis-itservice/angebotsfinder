<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1117">
    <title>Angebotsfinder – Push-Nachrichten</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/style.css?v=__VERSION__">
</head>
<body>
    <header>
        <div class="header-bar">
            <h1><svg class="icon header-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg> Angebotsfinder</h1>
            <div class="header-actions">
                <form method="POST" action="/logout">
                    <button type="submit" class="icon-btn" title="Abmelden" aria-label="Abmelden">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    </button>
                </form>
            </div>
        </div>
        <p class="subtitle">Push-Nachrichten</p>
    </header>
    <main>
        <a href="/" class="back-link">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Zu den Angeboten
        </a>
        <div class="status-line unknown" id="push-status">Wird geprüft …</div>

        <div class="summary-card push-card">
            <p class="muted" id="push-rules"></p>
            <div class="actions">
                <button type="button" class="action-btn primary" id="btn-enable" hidden>Auf diesem Gerät aktivieren</button>
                <button type="button" class="action-btn" id="btn-test" hidden>Test senden</button>
                <button type="button" class="action-btn" id="btn-disable" hidden>Auf diesem Gerät abschalten</button>
            </div>
        </div>

        <h2 class="section-title">Angemeldete Geräte</h2>
        <div class="table-wrap">
            <table class="list-table">
                <thead>
                    <tr><th>Gerät</th><th>Seit</th><th>Zuletzt zugestellt</th><th>Letzter Fehler</th><th></th></tr>
                </thead>
                <tbody id="device-rows">
                    <tr><td colspan="5" class="muted">Wird geladen …</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <span class="app-version">Angebotsfinder __VERSION__</span>
        <span id="last-update">–</span>
        <span></span>
    </footer>
    <script src="/static/common.js?v=__VERSION__"></script>
    <script src="/static/push.js?v=__VERSION__"></script>
</body>
</html>
